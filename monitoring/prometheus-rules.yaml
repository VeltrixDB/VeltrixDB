apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: veltrixdb-alerts
  namespace: veltrixdb
  labels:
    app.kubernetes.io/name: veltrixdb
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: veltrixdb.storage
      interval: 30s
      rules:

        # ── Write admission throttle ──────────────────────────────────────────
        - alert: VeltrixDBWriteThrottleActive
          expr: |
            rate(veltrixdb_storage_write_admission_throttles_total[2m]) > 10
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "VeltrixDB write admission throttle active on {{ $labels.node }}"
            description: >
              Write admission control is throttling Puts because the read latency EWMA is above 20 ms
              (it clears below 10 ms).
              Rate: {{ $value | humanize }}/s.
              Check veltrixdb_storage_read_latency_seconds histogram for root cause.

        # ── VLog GC stalled ───────────────────────────────────────────────────
        - alert: VeltrixDBVLogGCStalled
          expr: |
            (
              rate(veltrixdb_vlog_gc_skipped_paused_total[5m]) > 0
            ) and (
              veltrixdb_vlog_garbage_ratio > 0.5
            )
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "VeltrixDB VLog GC paused on {{ $labels.node }}"
            description: >
              VLog GC is paused because the read latency EWMA is above 20 ms and the garbage ratio
              is {{ $value | humanizePercentage }}. GC will auto-resume 4 min after
              reads return to normal. Check read latency immediately.

        # ── VLog corruption ───────────────────────────────────────────────────
        - alert: VeltrixDBVLogReadErrors
          expr: |
            rate(veltrixdb_vlog_gc_read_errors_total[5m]) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "VeltrixDB VLog read errors on {{ $labels.node }}"
            description: >
              VLog GC is encountering read errors (bad magic or CRC). This indicates
              possible VLog corruption on disk {{ $labels.disk }}. Run
              'veltrix-admin check --data-dirs <dirs>' offline immediately.

        # ── Cache hit rate low ────────────────────────────────────────────────
        - alert: VeltrixDBLowCacheHitRate
          expr: |
            (
              rate(veltrixdb_cache_hits_total[5m])
            ) / (
              rate(veltrixdb_cache_hits_total[5m]) +
              rate(veltrixdb_cache_misses_total[5m]) + 0.001
            ) < 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "VeltrixDB cache hit rate below 50% on {{ $labels.node }}"
            description: >
              Cache hit rate is {{ $value | humanizePercentage }} over the last 5 min.
              Consider increasing --cache (MB), or check whether
              the keyspace is larger than the cache capacity.

        # ── Read latency ──────────────────────────────────────────────────────
        - alert: VeltrixDBHighReadLatency
          expr: |
            histogram_quantile(0.99,
              rate(veltrixdb_storage_read_latency_seconds_bucket[5m])
            ) > 0.010
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "VeltrixDB P99 read latency > 10 ms on {{ $labels.node }}"
            description: >
              P99 read latency is {{ $value | humanizeDuration }}.
              On NVMe hardware this should be < 2 ms. Check for VLog GC pressure,
              cache eviction storm, or disk saturation.

        # ── Node failure detector ─────────────────────────────────────────────
        # There is no "currently failed" gauge; the heartbeat monitor exports
        # cumulative failed / recovered counters. More failures than recoveries
        # in the window means a peer is still down.
        - alert: VeltrixDBNodeFailed
          expr: |
            increase(veltrixdb_failure_detector_nodes_failed_total[10m])
              - increase(veltrixdb_failure_detector_nodes_recovered_total[10m]) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "VeltrixDB cluster node failure detected by {{ $labels.node }}"
            description: >
              {{ $value }} peer node(s) missed heartbeats and have not recovered in the
              last 10 minutes. Check pod status and network connectivity. Quorum may
              be at risk.

        # ── Cluster shrank ────────────────────────────────────────────────────
        # The server exports no per-partition replica health, so this watches the
        # registered node count instead: fewer nodes than an hour ago means some
        # partitions are running below their replication factor.
        - alert: VeltrixDBClusterShrank
          expr: |
            veltrixdb_cluster_nodes_total < max_over_time(veltrixdb_cluster_nodes_total[1h])
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "VeltrixDB cluster has fewer nodes than an hour ago ({{ $labels.node }})"
            description: >
              {{ $labels.node }} now sees {{ $value }} registered node(s). Partitions
              owned by the missing node(s) have fewer replicas until they return or
              the ring is rebalanced (--auto-rebalance).

        # ── Scrubber found corruption ─────────────────────────────────────────
        - alert: VeltrixDBScrubCorruption
          expr: |
            increase(veltrixdb_scrub_corruption_total[15m]) > 0
          labels:
            severity: critical
          annotations:
            summary: "VeltrixDB background scrubber found a CRC mismatch on {{ $labels.node }}"
            description: >
              The scrubber read a VLog record with a bad magic or CRC32C. The server
              log line "[scrub] disk=N offset=M ... MISMATCH" gives the disk and offset.
              Treat the disk as suspect and restore the affected keys from a replica or backup.

    - name: veltrixdb.process
      interval: 60s
      rules:

        # ── Disk space ────────────────────────────────────────────────────────
        - alert: VeltrixDBDiskUsageHigh
          expr: |
            1 - (
              node_filesystem_avail_bytes{mountpoint=~"/mnt/nvme.*"}
                / node_filesystem_size_bytes{mountpoint=~"/mnt/nvme.*"}
            ) > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "VeltrixDB data disk > 85% full ({{ $labels.mountpoint }})"
            description: >
              {{ $labels.mountpoint }} is {{ $value | humanizePercentage }} full (node-exporter
              filesystem metrics). Check veltrixdb_vlog_garbage_ratio: high garbage means
              GC is behind ('veltrix-admin compact'); otherwise add capacity.

        # ── Process restart ───────────────────────────────────────────────────
        - alert: VeltrixDBProcessRestarted
          expr: |
            increase(process_start_time_seconds{job="veltrixdb"}[5m]) > 0
          labels:
            severity: info
          annotations:
            summary: "VeltrixDB process restarted on {{ $labels.node }}"
            description: >
              The VeltrixDB process on {{ $labels.node }} restarted in the last 5 minutes.
              Check WAL replay logs for errors.
