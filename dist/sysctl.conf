# /etc/sysctl.d/99-veltrixdb.conf
# Copy to /etc/sysctl.d/ and run: sysctl --system

# ── HugePages (C++ ART slab allocator) ───────────────────────────────────────
# 512 × 2MB = 1 GiB of hugepages. Only the ART slab allocator uses them, and
# the ART index has no Go call site today, so the server does not need this.
# Increase if ArtSlabAllocator logs "hugepage allocation failed".
vm.nr_hugepages = 512

# ── File descriptor limits ────────────────────────────────────────────────────
# VeltrixDB opens: 8 segment files + 8 WAL files + TCP connections per client.
fs.file-max = 2097152

# ── io_uring locked memory ────────────────────────────────────────────────────
# Only relevant when the io_uring VLog bridge is opted in
# (VELTRIXDB_URING_BRIDGE=on|sqpoll; default off).
# io_uring_register_buffers requires RLIMIT_MEMLOCK for fixed buffer mapping.
# Set to max (unlimited) so the registered buffer pool is never rejected.
# Equivalent to: ulimit -l unlimited
# Note: this sysctl does not set per-process memlock; set via limits.conf too.

# ── Memory mappings (native off-heap index) ──────────────────────────────────
# A CGO build keeps the Index Vault off the Go heap (storage/native_index.cpp),
# one mmap per shard array of a page or more: ~3 per shard x 8192 shards,
# ~25K mappings per engine once the index is large. The default of 65530
# leaves too little room for the Go runtime, io_uring rings and any second
# engine in the process; mmap then fails with ENOMEM and the server panics
# on insert. 262144 is the value Elasticsearch and others ship with.
vm.max_map_count = 262144

# ── TCP tuning (for high-concurrency client connections) ─────────────────────
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728
net.ipv4.tcp_rmem = 4096 87380 134217728
net.ipv4.tcp_wmem = 4096 65536 134217728
net.core.netdev_max_backlog = 65536
net.ipv4.tcp_max_syn_backlog = 65536

# ── NVMe I/O scheduler ────────────────────────────────────────────────────────
# Set per device after boot (see hugepages.sh for the full setup script).
# echo "none" > /sys/block/nvme0n1/queue/scheduler
