name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write   # push bench image to GHCR

jobs:
  # ── Node 1: build + unit tests ────────────────────────────────────────────
  node-1-storage:
    name: "Node 1 — build + unit tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: record start time
        id: t0
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(find . -name '*.go' -not -path './dist/*'))"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -d $(echo "$unformatted")
            exit 1
          fi

      - name: build
        run: CGO_ENABLED=0 go build ./...

      - name: vet
        run: CGO_ENABLED=0 go vet ./...

      # Put test scratch on tmpfs.
      #
      # THIS is why the storage suite took 45+ minutes on a runner and 18
      # seconds on a developer laptop, and no timeout tuning was ever going to
      # close that gap. Every Put fdatasyncs twice (WAL and VLog). On macOS
      # syscall.Fsync is plain fsync(2), which on Darwin returns as soon as the
      # write reaches the drive cache — effectively free. On Linux,
      # syscall.Fdatasync against a runner's network-backed disk is a real
      # round trip, and the suite performs thousands of them across tests that
      # run in parallel and contend for the same device.
      #
      # t.TempDir() honours TMPDIR, so pointing it at tmpfs makes those syncs
      # memory-speed. Durability semantics are unchanged — the code still
      # calls fdatasync, it just lands on a RAM-backed filesystem.
      - name: mount tmpfs for test scratch
        run: |
          sudo mkdir -p /mnt/veltrix-tmp
          sudo mount -t tmpfs -o size=6G,mode=1777 tmpfs /mnt/veltrix-tmp
          df -h /mnt/veltrix-tmp

      - name: storage + adminapi tests
        run: CGO_ENABLED=0 TMPDIR=/mnt/veltrix-tmp go test -timeout 300s -count=1 ./storage/... ./adminapi/...

      - name: client + security + tracing tests
        run: CGO_ENABLED=0 go test -timeout 60s -count=1 ./client/... ./security/... ./tracing/...

      - name: push CI metrics
        if: always()
        env:
          PUSH_GW_URL: ${{ secrets.PUSH_GW_URL }}
        run: |
          bash scripts/push-ci-metrics.sh \
            --job    "node-1-storage" \
            --start  "${{ steps.t0.outputs.ts }}" \
            --status "${{ job.status }}" \
            --run-id "${{ github.run_id }}" \
            --sha    "${{ github.sha }}" \
            --branch "${{ github.ref_name }}"

  # ── Node 2: consensus + cluster + replication tests ───────────────────────
  node-2-cluster:
    name: "Node 2 — consensus + cluster + replication"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: record start time
        id: t0
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: consensus tests
        run: CGO_ENABLED=0 go test -timeout 120s -count=1 ./consensus/...

      - name: cluster tests
        run: CGO_ENABLED=0 go test -timeout 120s -count=1 ./cluster/...

      - name: replication tests
        run: CGO_ENABLED=0 go test -timeout 120s -count=1 ./replication/...

      - name: push CI metrics
        if: always()
        env:
          PUSH_GW_URL: ${{ secrets.PUSH_GW_URL }}
        run: |
          bash scripts/push-ci-metrics.sh \
            --job    "node-2-cluster" \
            --start  "${{ steps.t0.outputs.ts }}" \
            --status "${{ job.status }}" \
            --run-id "${{ github.run_id }}" \
            --sha    "${{ github.sha }}" \
            --branch "${{ github.ref_name }}"

  # ── Node 3: 3-node integration tests ──────────────────────────────────────
  # Spins up 3 real server processes on the runner and runs full integration
  # tests: crash recovery, node failover, leader election, backup/restore.
  node-3-integration:
    name: "Node 3 — 3-node integration"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: record start time
        id: t0
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      # Put test scratch on tmpfs.
      #
      # THIS is why the storage suite took 45+ minutes on a runner and 18
      # seconds on a developer laptop, and no timeout tuning was ever going to
      # close that gap. Every Put fdatasyncs twice (WAL and VLog). On macOS
      # syscall.Fsync is plain fsync(2), which on Darwin returns as soon as the
      # write reaches the drive cache — effectively free. On Linux,
      # syscall.Fdatasync against a runner's network-backed disk is a real
      # round trip, and the suite performs thousands of them across tests that
      # run in parallel and contend for the same device.
      #
      # t.TempDir() honours TMPDIR, so pointing it at tmpfs makes those syncs
      # memory-speed. Durability semantics are unchanged — the code still
      # calls fdatasync, it just lands on a RAM-backed filesystem.
      - name: mount tmpfs for test scratch
        run: |
          sudo mkdir -p /mnt/veltrix-tmp
          sudo mount -t tmpfs -o size=6G,mode=1777 tmpfs /mnt/veltrix-tmp
          df -h /mnt/veltrix-tmp

      - name: build server binary
        run: CGO_ENABLED=0 go build -o /tmp/veltrixdb ./cmd/server

      - name: build backup binary
        run: CGO_ENABLED=0 go build -o /tmp/veltrixdb-backup ./cmd/backup

      # Output is teed to a file and uploaded on failure. A -v run is long
      # enough that the interesting "--- FAIL:" line scrolls far above the
      # tail, which is all anyone reads from a failed job; without the
      # artifact the actual assertion is effectively unrecoverable.
      - name: integration tests (starts 3 in-process server nodes)
        run: |
          set -o pipefail
          CGO_ENABLED=0 go test -v -timeout 300s -count=1 ./tests/integration/... \
            2>&1 | tee /tmp/integration-test-output.txt
        env:
          VELTRIX_SERVER_BIN: /tmp/veltrixdb
          VELTRIX_BACKUP_BIN: /tmp/veltrixdb-backup
          TMPDIR: /mnt/veltrix-tmp

      # Re-print just the failures at the very end of the log, so the job
      # summary shows what broke without downloading anything.
      - name: summarise failures
        if: failure()
        run: |
          echo "───────── FAILED TESTS ─────────"
          grep -E '^--- FAIL|^\s+--- FAIL|^    .*_test\.go:[0-9]+:' \
            /tmp/integration-test-output.txt | head -60 || echo "(no --- FAIL lines found)"
          echo "────────────────────────────────"

      - name: upload full test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-output
          path: /tmp/integration-test-output.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: /tmp/veltrix-*/**/*.log
          if-no-files-found: ignore
          retention-days: 3

      - name: push CI metrics
        if: always()
        env:
          PUSH_GW_URL: ${{ secrets.PUSH_GW_URL }}
        run: |
          bash scripts/push-ci-metrics.sh \
            --job    "node-3-integration" \
            --start  "${{ steps.t0.outputs.ts }}" \
            --status "${{ job.status }}" \
            --run-id "${{ github.run_id }}" \
            --sha    "${{ github.sha }}" \
            --branch "${{ github.ref_name }}"

  # ── node-4: paper-changes unit tests ─────────────────────────────────────
  # Dedicated job so failures here are clearly attributed to the 5 paper-derived
  # changes (IOPOLL, temperature-weighted GC, defrag thread pinning, cgroup
  # throttle, background tiering) rather than being buried in node-1 output.
  node-4-paper-changes:
    name: "Node 4 — paper-changes unit tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [node-1-storage]
    steps:
      - uses: actions/checkout@v4

      - name: record start time
        id: t0
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      # change-2: cold-first GC sort
      - name: "change-2 — temperature-weighted GC sort"
        run: CGO_ENABLED=0 go test -v -run "TestGCColdFirstSort" -count=1 ./storage/...

      # change-3: defrag thread pinning (no-op on non-Linux, must not panic anywhere)
      - name: "change-3 — defrag thread pinning"
        run: CGO_ENABLED=0 go test -v -run "TestLockDefragThread" -count=1 ./storage/...

      # change-4+5: FlagTiered constant, NopColdTier correctness, TierManager filtering
      - name: "change-4+5 — FlagTiered / NopColdTier / TierManager"
        run: |
          CGO_ENABLED=0 go test -v -count=1 \
            -run "TestFlagTiered_Constant|TestNopColdTier|TestTierManager|TestNewS3ColdTierSimple|TestNewGCSColdTierSimple" \
            ./storage/...

      - name: push CI metrics
        if: always()
        env:
          PUSH_GW_URL: ${{ secrets.PUSH_GW_URL }}
        run: |
          bash scripts/push-ci-metrics.sh \
            --job    "node-4-paper-changes" \
            --start  "${{ steps.t0.outputs.ts }}" \
            --status "${{ job.status }}" \
            --run-id "${{ github.run_id }}" \
            --sha    "${{ github.sha }}" \
            --branch "${{ github.ref_name }}"

  # ── Node 5: race detector ─────────────────────────────────────────────────
  # -race REQUIRES cgo, and enabling cgo silently switches the storage engine
  # onto the C++ path: every NewStorageEngine would build an io_uring bridge
  # with SQPOLL (a busy-polling kernel thread per ring) plus NumCPU() C++
  # worker threads. A test suite constructs dozens of engines, and on a 2-core
  # runner that starved the job into a 30-minute timeout (SIGTERM, exit 143).
  #
  # So: cgo ON (for -race), C++ engine OFF (via VELTRIXDB_DISABLE_CGO_ENGINE).
  # This job is here to find data races in the Go logic; node-6-cpp is what
  # exercises the C++ layer.
  #
  # Split into a matrix so each group gets its own timeout budget and they run
  # in parallel — -race is roughly 5-10x slower on a 2-core runner.
  node-5-race:
    name: "Node 5 — race (${{ matrix.group }})"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: storage
            pkgs: "./storage/..."
          - group: server
            pkgs: "./cmd/server/..."
          - group: cluster
            pkgs: "./consensus/... ./cluster/... ./replication/..."
          - group: rest
            pkgs: "./adminapi/... ./client/... ./security/... ./tracing/..."
    env:
      CGO_ENABLED: "1"
      VELTRIXDB_DISABLE_CGO_ENGINE: "1"
      TMPDIR: /mnt/veltrix-tmp
    steps:
      - uses: actions/checkout@v4

      - name: record start time
        id: t0
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      # Put test scratch on tmpfs.
      #
      # THIS is why the storage suite took 45+ minutes on a runner and 18
      # seconds on a developer laptop, and no timeout tuning was ever going to
      # close that gap. Every Put fdatasyncs twice (WAL and VLog). On macOS
      # syscall.Fsync is plain fsync(2), which on Darwin returns as soon as the
      # write reaches the drive cache — effectively free. On Linux,
      # syscall.Fdatasync against a runner's network-backed disk is a real
      # round trip, and the suite performs thousands of them across tests that
      # run in parallel and contend for the same device.
      #
      # t.TempDir() honours TMPDIR, so pointing it at tmpfs makes those syncs
      # memory-speed. Durability semantics are unchanged — the code still
      # calls fdatasync, it just lands on a RAM-backed filesystem.
      - name: mount tmpfs for test scratch
        run: |
          sudo mkdir -p /mnt/veltrix-tmp
          sudo mount -t tmpfs -o size=6G,mode=1777 tmpfs /mnt/veltrix-tmp
          df -h /mnt/veltrix-tmp

      # cgo on Linux compiles the storage package's C++ shims, which include
      # liburing headers even though the engine itself is disabled above.
      - name: install liburing
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends liburing-dev

      # -timeout is deliberately WELL BELOW timeout-minutes.
      #
      # Previously it was 2400s against a 45-minute job budget, so the runner
      # SIGTERMed the job (exit 143) before Go's own timeout could fire — which
      # meant no diagnostics at all, just "exit code 143". Go's timeout, by
      # contrast, panics and dumps every goroutine's stack, which names the
      # thing that is stuck.
      #
      # These groups take 18-30s locally on 2 cores under -race, so 600s is
      # ~20x headroom. If a group exceeds it, we want the stack dump, not a
      # silent kill. -v so the last "=== RUN" identifies the offending test.
      - name: "${{ matrix.group }} under -race"
        run: |
          set -o pipefail
          go test -race -v -timeout 600s -count=1 ${{ matrix.pkgs }} \
            2>&1 | tee /tmp/race-${{ matrix.group }}.txt

      # On a hang, Go's timeout panic dumps every goroutine; on a failure, the
      # assertion is buried mid-log. Surface both at the end of the job.
      - name: summarise failures
        if: failure()
        run: |
          echo "───────── FAILED TESTS ─────────"
          grep -E '^--- FAIL|^\s+--- FAIL' /tmp/race-${{ matrix.group }}.txt | head -40 \
            || echo "(none — likely a timeout/panic, see below)"
          echo "───────── PANIC / TIMEOUT ──────"
          grep -A40 -E '^panic:|test timed out' /tmp/race-${{ matrix.group }}.txt | head -80 \
            || echo "(no panic)"
          echo "────────────────────────────────"

      - name: upload full test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: race-output-${{ matrix.group }}
          path: /tmp/race-${{ matrix.group }}.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: push CI metrics
        if: always()
        env:
          PUSH_GW_URL: ${{ secrets.PUSH_GW_URL }}
        run: |
          bash scripts/push-ci-metrics.sh \
            --job    "node-5-race-${{ matrix.group }}" \
            --start  "${{ steps.t0.outputs.ts }}" \
            --status "${{ job.status }}" \
            --run-id "${{ github.run_id }}" \
            --sha    "${{ github.sha }}" \
            --branch "${{ github.ref_name }}"

  # ── Node 6: C++ layer ─────────────────────────────────────────────────────
  # No other job compiles cpp/ at all: every Go job is CGO_ENABLED=0, and the
  # published Docker image is too. A change under cpp/ was therefore completely
  # unverified. This builds both halves of the C++ story:
  #   1. the CMake static lib (libveltrixdb_engine.a)
  #   2. the cgo shims in storage/, which compile batch_engine.cpp,
  #      uring_reader.cpp and numa_topology.cpp into the Go package
  node-6-cpp:
    name: "Node 6 — C++ / cgo build"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # GATING. Every source under cpp/ was verified to compile before this
    # job was allowed to block: each was run through the compiler against the
    # REAL liburing headers (fetched from axboe/liburing), not a hand-written
    # stub, so API misuse would have surfaced. That verification found and
    # fixed a genuine bug — cpp/include/shard.hpp declared `class alignas(64)
    # Shard` while holding an alignas(4096) member, which is ill-formed
    # ([dcl.align]/5). It had gone unnoticed because nothing compiled
    # shard.cpp.
    #
    # Residual risk this job exists to cover: the local check used clang, CI
    # uses g++, and -fsyntax-only does not link. The one clang/GCC divergence
    # this codebase documents (CWG 1497, invariant 12) was checked by hand —
    # Defragmenter::Config is the only nested config struct and already uses a
    # constructor initializer list.
    steps:
      - uses: actions/checkout@v4

      - name: record start time
        id: t0
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: install liburing + cmake
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends liburing-dev cmake g++

      - name: cmake configure + build
        run: |
          cmake -S cpp -B cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++ \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build cpp/build --parallel "$(nproc)"

      - name: cgo build (compiles the storage/ C++ shims)
        run: CGO_ENABLED=1 go build ./storage/... ./cmd/server/...

      - name: cgo vet
        run: CGO_ENABLED=1 go vet ./storage/...

      - name: storage tests with cgo enabled
        run: CGO_ENABLED=1 go test -timeout 300s -count=1 ./storage/...

      - name: full build via scripts/build.sh
        run: VERSION=ci ./scripts/build.sh --output /tmp/dist

      - name: push CI metrics
        if: always()
        env:
          PUSH_GW_URL: ${{ secrets.PUSH_GW_URL }}
        run: |
          bash scripts/push-ci-metrics.sh \
            --job    "node-6-cpp" \
            --start  "${{ steps.t0.outputs.ts }}" \
            --status "${{ job.status }}" \
            --run-id "${{ github.run_id }}" \
            --sha    "${{ github.sha }}" \
            --branch "${{ github.ref_name }}"

  # ── bench: packing density + GC emergency hard gates ──────────────────────
  bench:
    name: "Bench — density + GC gates + paper-changes microbench"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [node-1-storage, node-2-cluster, node-4-paper-changes]
    steps:
      - uses: actions/checkout@v4

      - name: record start time
        id: t0
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: install bc + benchstat
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bc
          go install golang.org/x/perf/cmd/benchstat@latest

      - name: run bench (200K keys, CI scale)
        run: |
          CGO_ENABLED=0 \
          NUM_KEYS=200000 \
          DATA_DIRS=/tmp/veltrixdb-bench \
          CACHE_MB=512 \
            ./scripts/bench.sh

      # ── paper-changes micro-benchmarks ────────────────────────────────────
      # Run 3× for stable numbers; benchstat will report mean ± variance.
      - name: "paper-changes — GC sort benchmarks"
        run: |
          CGO_ENABLED=0 go test \
            -bench="BenchmarkGCColdFirstSort" \
            -benchmem -benchtime=3s -count=3 \
            -run ^$ ./storage/... \
            | tee /tmp/bench-gc-sort.txt
          cat /tmp/bench-gc-sort.txt

      - name: "paper-changes — tiering benchmarks"
        run: |
          CGO_ENABLED=0 go test \
            -bench="BenchmarkNopColdTier|BenchmarkPutColdTier_LocalFS|BenchmarkGetColdTier_LocalFS|BenchmarkTierManager_Enqueue" \
            -benchmem -benchtime=3s -count=3 \
            -run ^$ ./storage/... \
            | tee /tmp/bench-tiering.txt
          cat /tmp/bench-tiering.txt

      # Regression gate: benchstat exits non-zero if delta > threshold.
      # Baseline persists across runs via the actions cache (download-artifact@v4
      # can only see artifacts of the SAME run, so an artifact-based baseline
      # would never be found). On the first run (no cached baseline, e.g. a
      # fresh repository) the check is skipped and this run seeds the cache.
      - name: restore baseline benchmarks
        id: baseline
        uses: actions/cache/restore@v4
        with:
          path: /tmp/bench-baseline
          key: bench-paper-baseline-${{ github.run_id }}
          restore-keys: |
            bench-paper-baseline-

      - name: regression check (±15% threshold)
        if: steps.baseline.outputs.cache-matched-key != ''
        run: |
          cat /tmp/bench-baseline/gc-sort.txt /tmp/bench-gc-sort.txt \
            | benchstat -delta-test=none /dev/stdin \
            | tee /tmp/benchstat-gc-sort.txt
          cat /tmp/bench-baseline/tiering.txt /tmp/bench-tiering.txt \
            | benchstat -delta-test=none /dev/stdin \
            | tee /tmp/benchstat-tiering.txt
          # Fail if any benchmark regressed by more than 15%.
          if grep -E '\+[0-9]{2,}%|\+1[5-9]\.' /tmp/benchstat-gc-sort.txt /tmp/benchstat-tiering.txt; then
            echo "Benchmark regression detected — see output above"
            exit 1
          fi

      # Save this run's numbers as the new baseline (main branch only). The
      # run-id key is always unique, so every main run overwrites the newest
      # baseline; restore-keys prefix-matches the most recent one.
      - name: save benchmark baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          rm -rf /tmp/bench-baseline
          mkdir -p /tmp/bench-baseline
          cp /tmp/bench-gc-sort.txt /tmp/bench-baseline/gc-sort.txt
          cp /tmp/bench-tiering.txt /tmp/bench-baseline/tiering.txt
      - uses: actions/cache/save@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: /tmp/bench-baseline
          key: bench-paper-baseline-${{ github.run_id }}

      - name: upload bench output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-output
          path: |
            /tmp/veltrixdb-bench-out/**
            /tmp/bench-gc-sort.txt
            /tmp/bench-tiering.txt
            /tmp/benchstat-*.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: push CI metrics
        if: always()
        env:
          PUSH_GW_URL: ${{ secrets.PUSH_GW_URL }}
        run: |
          bash scripts/push-ci-metrics.sh \
            --job    "bench" \
            --start  "${{ steps.t0.outputs.ts }}" \
            --status "${{ job.status }}" \
            --run-id "${{ github.run_id }}" \
            --sha    "${{ github.sha }}" \
            --branch "${{ github.ref_name }}"

  # ── security: govulncheck ──────────────────────────────────────────────────
  security:
    name: "Security — govulncheck"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: record start time
        id: t0
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: scan
        run: CGO_ENABLED=0 govulncheck ./...
        continue-on-error: true

      - name: push CI metrics
        if: always()
        env:
          PUSH_GW_URL: ${{ secrets.PUSH_GW_URL }}
        run: |
          bash scripts/push-ci-metrics.sh \
            --job    "security" \
            --start  "${{ steps.t0.outputs.ts }}" \
            --status "${{ job.status }}" \
            --run-id "${{ github.run_id }}" \
            --sha    "${{ github.sha }}" \
            --branch "${{ github.ref_name }}"

  # ── docker bench image (push to main only) ────────────────────────────────
  bench-image:
    name: "Docker — bench image"
    runs-on: ubuntu-latest
    needs: [node-1-storage]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: record start time
        id: t0
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: build loadtest binary
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w" -o dist/veltrixdb-loadtest ./cmd/loadtest

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.bench
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ghcr.io/veltrixdb/veltrixdb-bench:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: push CI metrics
        if: always()
        env:
          PUSH_GW_URL: ${{ secrets.PUSH_GW_URL }}
        run: |
          bash scripts/push-ci-metrics.sh \
            --job    "bench-image" \
            --start  "${{ steps.t0.outputs.ts }}" \
            --status "${{ job.status }}" \
            --run-id "${{ github.run_id }}" \
            --sha    "${{ github.sha }}" \
            --branch "${{ github.ref_name }}"
