name: Release

# Runs only after CI completes successfully on the default branch.
# Flow: CI passes → bump minor tag (v1.0 → v1.1 → …) → Docker push → GitHub Release.
#
# Uses GITHUB_TOKEN to push images to GHCR (ghcr.io/veltrixdb/veltrixdb).
# No additional secrets are required.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]
  # Re-create the GitHub Release for a tag that already exists (e.g. after the
  # release job failed). Does not create a tag or push an image.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)create the release for, e.g. v1.9"
        required: true

permissions:
  contents: write   # create tags + releases
  packages: write   # push to GHCR

jobs:
  # ── 1. Auto-increment the minor version tag ─────────────────────────────────
  tag:
    name: Bump version tag
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      prev_tag: ${{ steps.bump.outputs.prev_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute and push next tag
        id: bump
        run: |
          git fetch --tags --quiet
          LATEST=$(git tag -l 'v1.*' --sort=-version:refname \
                    | grep -E '^v1\.[0-9]+$' | head -1)
          PREV="${LATEST}"
          if [ -z "$LATEST" ]; then
            NEXT="v1.0"
          else
            MINOR=$(echo "$LATEST" | sed 's/^v1\.//')
            NEXT="v1.$((MINOR + 1))"
          fi
          echo "tag=$NEXT"       >> "$GITHUB_OUTPUT"
          echo "prev_tag=$PREV"  >> "$GITHUB_OUTPUT"
          git tag "$NEXT"
          git push origin "$NEXT"

  # ── 2. Build + push Docker image to GHCR ───────────────────────────────────
  docker:
    name: Build + push Docker image
    runs-on: ubuntu-latest
    needs: tag
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/veltrixdb/veltrixdb:${{ needs.tag.outputs.tag }}
            ghcr.io/veltrixdb/veltrixdb:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.tag.outputs.tag }}

  # ── 3. Create GitHub Release with changelog ─────────────────────────────────
  # Runs after tagging only — independent of whether Docker push succeeded.
  #
  # Commit subjects are untrusted text: they are written to a notes FILE and
  # never pasted into the script. Interpolating them with ${{ }} into a
  # double-quoted --notes string broke v1.9 (a subject containing "quotes"
  # split the argument) and let a crafted subject run shell commands.
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: tag
    if: ${{ always() && (needs.tag.result == 'success' || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG_FROM_JOB: ${{ needs.tag.outputs.tag }}
          PREV_FROM_JOB: ${{ needs.tag.outputs.prev_tag }}
          TAG_FROM_INPUT: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --quiet
          if [ -n "${TAG_FROM_INPUT:-}" ]; then
            TAG="$TAG_FROM_INPUT"
            git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || { echo "tag $TAG does not exist"; exit 1; }
            # previous v1.N tag by version order
            PREV=$(git tag -l 'v1.*' --sort=-version:refname | grep -E '^v1\.[0-9]+$' \
                   | awk -v t="$TAG" 'f{print; exit} $0==t{f=1}')
          else
            TAG="$TAG_FROM_JOB"
            PREV="$PREV_FROM_JOB"
          fi
          RANGE="${PREV:+${PREV}..}${TAG}"

          {
            echo "## What's changed in ${TAG}"
            echo
            git log --pretty=format:'- %s (%h)' "$RANGE"
            echo
            echo
            echo "## Docker image"
            echo
            echo '```'
            echo "docker pull ghcr.io/veltrixdb/veltrixdb:${TAG}"
            echo '```'
            echo
            echo "## Full diff"
            echo "https://github.com/${REPO}/compare/${RANGE}"
          } > release-notes.md
          cat release-notes.md

          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" --title "VeltrixDB ${TAG}" --notes-file release-notes.md
