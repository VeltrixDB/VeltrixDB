# Aerospike CE config for scripts/compare.sh: one namespace "test" stored in a
# file on the benchmark disk, index in RAM (the same split as VeltrixDB).
#
# Durability: Aerospike acknowledges a write once it is in the write block
# buffer; flush-max-ms bounds how long it can stay there. commit-to-device
# (flush before ACK) is documented as an Enterprise feature — check your
# edition and version, and state the setting next to any published number.
# compare.sh rewrites both lines from AEROSPIKE_FLUSH_MAX_MS (default 1) and
# AEROSPIKE_COMMIT_TO_DEVICE=1 into results/<ts>/aerospike-conf/ before use.
service {
	proto-fd-max 15000
}
logging {
	console {
		context any info
	}
}
network {
	service {
		address any
		port 3000
	}
	heartbeat {
		mode mesh
		port 3002
	}
	fabric {
		port 3001
	}
}
namespace test {
	replication-factor 1
	default-ttl 0
	storage-engine device {
		file /opt/aerospike/data/test.dat
		filesize 32G
		flush-max-ms 1
		# commit-to-device true   # Enterprise: ACK after the write reaches the device
	}
}
