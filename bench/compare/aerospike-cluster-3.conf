# Aerospike CE, node 3 of the 3-node functional-check cluster in
# docker-compose.cluster.yml (fixed IPs on the "bench" network, mesh
# heartbeat). For real multi-host runs see README "Multi-host runbook".
#
# replication-factor 3: every record on all three nodes. Community Edition is
# AP only — strong-consistency (linearizable, roster-based) needs Enterprise.
# The YCSB client (go-ycsb, aerospike-client-go v1.35) writes with its default
# CommitLevel COMMIT_ALL (ACK after the master AND both replicas applied it)
# and reads from the master.
#
# Durability: a write is ACKed from the write-block buffer; flush-max-ms bounds
# how long it can stay there. commit-to-device (flush before ACK) is
# Enterprise. compare.sh rewrites both lines from AEROSPIKE_FLUSH_MAX_MS /
# AEROSPIKE_COMMIT_TO_DEVICE into results/<ts>/aerospike-conf/ before use.
service {
	proto-fd-max 15000
	cluster-name veltrix-bench
}
logging {
	console {
		context any info
	}
}
network {
	service {
		address any
		port 3000
		access-address 172.28.0.23
	}
	heartbeat {
		mode mesh
		address any
		port 3002
		mesh-seed-address-port 172.28.0.21 3002
		mesh-seed-address-port 172.28.0.22 3002
		mesh-seed-address-port 172.28.0.23 3002
		interval 150
		timeout 10
	}
	fabric {
		port 3001
	}
}
namespace test {
	replication-factor 3
	default-ttl 0
	storage-engine device {
		file /opt/aerospike/data/test.dat
		filesize 16G
		flush-max-ms 1
		# commit-to-device true   # Enterprise: ACK after the write reaches the device
	}
}
